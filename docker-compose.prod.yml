# Production stack. Variables come from a .env file next to this one (see .env.example).
# Start with: docker compose -f docker-compose.prod.yml up -d --build

x-database: &database
  PGHOST: db
  PGUSER: izalapp
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  PGDATABASE: izalapp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: izalapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: izalapp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izalapp -d izalapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://izalapp:${POSTGRES_PASSWORD}@db:5432/izalapp
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://izalapp:${POSTGRES_PASSWORD}@db:5432/izalapp
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      <<: *database
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
